services:
    repository-cache:
        image: redis:8-alpine
        ports:
            - '127.0.0.1:${REPOSITORY_REDIS_PORT:-6380}:6379'
        command:
            - redis-server
            - --save
            - ''
            - --appendonly
            - 'no'
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 2s
            retries: 5
